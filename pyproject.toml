[project]
name = "tt-aqa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.1",
    "faker>=40.39.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ['E', 'F', 'I']

[tool.mypy]
strict = true
disallow_untyped_decorators = false
exclude = ['tests/.*']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = 'tests.*'
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-v --alluredir=allure-results --clean-alluredir"
testpaths = ['tests']
markers = [
    'smoke: quick smoke',
    'regression: regress',
    'api : api tests',
    'ui : ui tests',
    'slow : slow running tests'
]
pythonpath = ["src"]